<style>
  :root{
    --bg:#10141f;
    --panel:#1b2130;
    --cell:#262e42;      /* recomputed as px at runtime for tile sizing */
    --cell-empty:#262e42;
    --gap:12px;          /* recomputed at runtime */
    --ink:#e8ecf4;
    --muted:#8b93a7;
    --accent:#5b8cff;
    --accent-2:#8b5cf6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(91,140,255,.14), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(139,92,246,.12), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Outfit', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%; max-width:460px;}

  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .brand{display:flex; flex-direction:column;}
  .logo{
    font-size:40px; font-weight:800; line-height:1; letter-spacing:-1px;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline{color:var(--muted); font-size:13px; margin-top:6px; max-width:210px; line-height:1.4;}

  .scores{display:flex; gap:8px;}
  .score{
    background:var(--panel); border-radius:var(--radius);
    padding:8px 14px; min-width:72px; text-align:center;
  }
  .score .label{font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase;}
  .score .val{font-size:22px; font-weight:700; line-height:1.1; margin-top:2px;}

  .controls{display:flex; gap:8px; margin-bottom:14px;}
  button{
    font-family:inherit; font-weight:600; font-size:14px; color:var(--ink);
    background:var(--panel); border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius); padding:10px 16px; cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{background:#232b3d;}
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn-primary{
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    border-color:transparent; color:#fff;
  }
  .btn-primary:hover{filter:brightness(1.05); background:linear-gradient(120deg, var(--accent), var(--accent-2));}
  button[disabled]{opacity:.4; cursor:default; transform:none;}

  .board-outer{position:relative; width:100%;}
  .board{
    position:relative; width:100%; aspect-ratio:1/1;
    background:var(--panel); border-radius:16px;
    padding:var(--gap);
    touch-action:none; user-select:none;
  }
  .cell, .tile{
    position:absolute; top:0; left:0;
    width:var(--cell); height:var(--cell);
    border-radius:var(--radius);
    transform:translate(
      calc(var(--gap) + var(--c) * (var(--cell) + var(--gap))),
      calc(var(--gap) + var(--r) * (var(--cell) + var(--gap)))
    );
  }
  .cell{background:var(--cell-empty);}
  .tile{
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff;
    transition:transform .12s ease;
    z-index:2;
  }
  .tile .v{line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.18);}
  .tile.dark .v{color:#171b26; text-shadow:none;}
  .tile.spawn{animation:spawn .16s ease;}
  .tile.pop{animation:pop .16s ease;}
  @keyframes spawn{ from{transform:translate(
      calc(var(--gap) + var(--c) * (var(--cell) + var(--gap))),
      calc(var(--gap) + var(--r) * (var(--cell) + var(--gap)))
    ) scale(.1); opacity:.2;} }
  @keyframes pop{ 0%{}
    45%{transform:translate(
      calc(var(--gap) + var(--c) * (var(--cell) + var(--gap))),
      calc(var(--gap) + var(--r) * (var(--cell) + var(--gap)))
    ) scale(1.16);}
    100%{} }

  .overlay{
    position:absolute; inset:0; border-radius:16px;
    background:rgba(16,20,31,.82); backdrop-filter:blur(3px);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; z-index:5; text-align:center; padding:24px;
  }
  .overlay.show{display:flex;}
  .overlay .msg{font-size:34px; font-weight:800; letter-spacing:-.5px;}
  .overlay .sub{color:var(--muted); font-size:14px; margin-top:-6px;}
  .overlay .row{display:flex; gap:10px;}

  .how{color:var(--muted); font-size:13px; line-height:1.6; margin-top:16px; text-align:center;}
  .how kbd{
    background:var(--panel); border:1px solid rgba(255,255,255,.08);
    border-radius:6px; padding:1px 7px; font-size:12px; font-family:inherit;
  }

  /* AdSense slot: 승인 후 아래 주석 위치에 코드를 넣으면 됩니다. 비어 있을 땐 화면에 아무것도 안 보입니다. */
  .ad-slot{width:100%; margin-top:20px; text-align:center; min-height:0;}
  .ad-slot:empty{display:none;}

  footer{margin-top:22px; color:var(--muted); font-size:12px; text-align:center; line-height:1.6;}
  footer a{color:var(--muted);}

  @media (max-width:380px){
    .logo{font-size:34px;}
    .tagline{font-size:12px;}
    .score{min-width:64px; padding:7px 10px;}
    .score .val{font-size:19px;}
  }
  @media (prefers-reduced-motion:reduce){
    .tile{transition:none;}
    .tile.spawn, .tile.pop{animation:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">Fuse</div>
        <div class="tagline">같은 숫자를 밀어 합치세요. 2048을 만들면 성공!</div>
      </div>
      <div class="scores">
        <div class="score"><div class="label">점수</div><div class="val" id="score">0</div></div>
        <div class="score"><div class="label">최고</div><div class="val" id="best">0</div></div>
      </div>
    </header>

    <div class="controls">
      <button class="btn-primary" id="new">새 게임</button>
      <button id="undo" disabled>되돌리기</button>
    </div>

    <div class="board-outer">
      <div class="board" id="board" role="application" aria-label="숫자 합치기 퍼즐 보드" tabindex="0"></div>
      <div class="overlay" id="overlay">
        <div>
          <div class="msg" id="ov-msg">2048 달성!</div>
          <div class="sub" id="ov-sub">계속 이어서 더 높은 숫자에 도전할 수 있어요.</div>
        </div>
        <div class="row" id="ov-row"></div>
      </div>
    </div>

    <div class="how">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · 모바일은 스와이프
    </div>

    <!-- ▼▼▼ 애드센스 코드는 여기 안에 붙여넣으세요 (승인 후) ▼▼▼ -->
    <div class="ad-slot" id="ad-slot"></div>
    <!-- ▲▲▲ 광고 자리 (비어 있으면 화면에 안 보입니다) ▲▲▲ -->

    <footer>
      <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;">
        <a href="how-to-play.html">게임 방법</a><span style="opacity:.4">·</span>
        <a href="about.html">소개</a><span style="opacity:.4">·</span>
        <a href="privacy.html">개인정보처리방침</a>
      </div>
      © <span id="fyear"></span> Fuse. 무료 숫자 퍼즐 게임.
    </footer>
  </div>

<script>
(() => {
  "use strict";

  const SIZE = 4;
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const undoBtn = document.getElementById('undo');
  const newBtn  = document.getElementById('new');
  const overlay = document.getElementById('overlay');
  const ovMsg   = document.getElementById('ov-msg');
  const ovSub   = document.getElementById('ov-sub');
  const ovRow   = document.getElementById('ov-row');
  document.getElementById('fyear').textContent = new Date().getFullYear();

  // --- 타일 색상: 숫자가 커질수록 차가운 색 → 뜨거운 색으로 (가치가 오르는 느낌) ---
  const COLORS = {
    2:'#3aa6a0', 4:'#37a86e', 8:'#6fae3c', 16:'#a7b52e', 32:'#d8b52a',
    64:'#e89a2c', 128:'#ee7a35', 256:'#f15a45', 512:'#ec4574',
    1024:'#c93fa0', 2048:'#8b5cf6'
  };
  const DARK_TEXT = new Set([16, 32, 64]); // 밝은 타일은 어두운 글씨
  const colorFor = v => COLORS[v] || '#6d5cff';

  // --- 저장소: 배포 시엔 localStorage로 최고점수 유지, 미지원 환경(미리보기)에선 메모리로 대체 ---
  const store = (() => {
    let mem = {};
    try {
      const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k);
      return {
        get:k => localStorage.getItem(k),
        set:(k,v) => localStorage.setItem(k,v)
      };
    } catch(e) {
      return { get:k => (k in mem ? mem[k] : null), set:(k,v) => { mem[k]=String(v); } };
    }
  })();

  let grid, score, best, tileId, history, won, keepPlaying, over;

  best = parseInt(store.get('fuse-best') || '0', 10) || 0;
  bestEl.textContent = best;

  // ---------- 레이아웃(반응형): 셀 크기/간격을 px로 계산 ----------
  function layout(){
    const w = board.clientWidth;
    const gap = Math.max(8, Math.round(w * 0.028));
    const cell = (w - gap * (SIZE + 1)) / SIZE;
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--cell', cell + 'px');
    // 폰트 크기도 셀에 맞춰
    document.querySelectorAll('.tile').forEach(el => sizeFont(el));
  }
  window.addEventListener('resize', layout);

  function sizeFont(el){
    const cell = parseFloat(getComputedStyle(board).getPropertyValue('--cell')) || 80;
    const len = (el.dataset.value || '').length;
    const scale = len <= 2 ? 0.46 : len === 3 ? 0.37 : 0.29;
    el.querySelector('.v').style.fontSize = (cell * scale) + 'px';
  }

  // ---------- 셀 배경 ----------
  function buildCells(){
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
      const d = document.createElement('div');
      d.className = 'cell';
      d.style.setProperty('--r', r);
      d.style.setProperty('--c', c);
      board.appendChild(d);
    }
  }

  // ---------- 타일 ----------
  function makeTile(r, c, value, spawn=true){
    const el = document.createElement('div');
    el.className = 'tile' + (spawn ? ' spawn' : '');
    el.dataset.value = value;
    el.style.setProperty('--r', r);
    el.style.setProperty('--c', c);
    const v = document.createElement('span');
    v.className = 'v';
    v.textContent = value;
    el.appendChild(v);
    paint(el, value);
    board.appendChild(el);
    sizeFont(el);
    const tile = { id: ++tileId, value, row:r, col:c, el, merged:false };
    grid[r][c] = tile;
    return tile;
  }

  function paint(el, value){
    el.style.background = colorFor(value);
    el.classList.toggle('dark', DARK_TEXT.has(value));
    if (value === 2048) el.style.boxShadow = '0 0 24px rgba(139,92,246,.55)';
  }

  function place(tile){
    tile.el.style.setProperty('--r', tile.row);
    tile.el.style.setProperty('--c', tile.col);
  }

  // ---------- 게임 로직 ----------
  const inB = (r,c) => r>=0 && r<SIZE && c>=0 && c<SIZE;
  const eachTile = fn => { for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]) fn(grid[r][c]); };

  function emptyCells(){
    const out=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!grid[r][c]) out.push([r,c]);
    return out;
  }

  function spawn(){
    const cells = emptyCells();
    if(!cells.length) return;
    const [r,c] = cells[Math.floor(Math.random()*cells.length)];
    makeTile(r, c, Math.random() < 0.9 ? 2 : 4, true);
  }

  function snapshot(){
    const vals = grid.map(row => row.map(t => t ? t.value : 0));
    return { vals, score, won, keepPlaying };
  }

  function restore(snap){
    board.querySelectorAll('.tile').forEach(el => el.remove());
    grid = Array.from({length:SIZE}, () => Array(SIZE).fill(null));
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(snap.vals[r][c]) makeTile(r, c, snap.vals[r][c], false);
    }
    score = snap.score; won = snap.won; keepPlaying = snap.keepPlaying; over = false;
    updateScore(); hideOverlay();
  }

  function farthest(r,c,dr,dc){
    let nr=r, nc=c;
    while(true){
      const tr=nr+dr, tc=nc+dc;
      if(!inB(tr,tc) || grid[tr][tc]) break;
      nr=tr; nc=tc;
    }
    return [nr,nc];
  }

  const VECT = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };

  function move(dir){
    if(over) return;
    if(overlay.classList.contains('show') && !keepPlaying) return;
    const [dr,dc] = VECT[dir];
    const rows=[...Array(SIZE).keys()], cols=[...Array(SIZE).keys()];
    if(dr>0) rows.reverse();
    if(dc>0) cols.reverse();

    const snap = snapshot();
    eachTile(t => t.merged=false);
    let moved=false;

    for(const r of rows) for(const c of cols){
      const tile = grid[r][c];
      if(!tile) continue;
      const [fr,fc] = farthest(r,c,dr,dc);
      const br=fr+dr, bc=fc+dc;
      const next = inB(br,bc) ? grid[br][bc] : null;

      if(next && next.value===tile.value && !next.merged){
        // 합치기: tile을 next 위로 슬라이드 후 제거, next를 팝
        grid[r][c]=null;
        tile.row=br; tile.col=bc; place(tile);
        next.value *= 2; next.merged = true;
        score += next.value;
        if(next.value===2048 && !won) won=true;
        const dying = tile, host = next;
        setTimeout(() => {
          dying.el.remove();
          host.el.dataset.value = host.value;
          host.el.querySelector('.v').textContent = host.value;
          paint(host.el, host.value);
          sizeFont(host.el);
          host.el.classList.remove('pop'); void host.el.offsetWidth; host.el.classList.add('pop');
        }, 120);
        moved=true;
      } else if(fr!==r || fc!==c){
        grid[r][c]=null; grid[fr][fc]=tile; tile.row=fr; tile.col=fc; place(tile);
        moved=true;
      }
    }

    if(moved){
      history = snap;
      undoBtn.disabled = false;
      updateScore();
      setTimeout(() => { spawn(); checkState(); }, 125);
    }
  }

  function movesLeft(){
    if(emptyCells().length) return true;
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      const v = grid[r][c].value;
      if((inB(r+1,c) && grid[r+1][c].value===v) ||
         (inB(r,c+1) && grid[r][c+1].value===v)) return true;
    }
    return false;
  }

  function checkState(){
    if(won && !keepPlaying){ showWin(); return; }
    if(!movesLeft()){ over=true; showOver(); }
  }

  function updateScore(){
    scoreEl.textContent = score;
    if(score > best){
      best = score; bestEl.textContent = best;
      store.set('fuse-best', best);
    }
  }

  // ---------- 오버레이 ----------
  function btn(label, primary, fn){
    const b = document.createElement('button');
    b.textContent = label;
    if(primary) b.className='btn-primary';
    b.addEventListener('click', fn);
    return b;
  }
  function showWin(){
    ovMsg.textContent='2048 달성!';
    ovSub.textContent='계속 이어서 더 높은 숫자에 도전할 수 있어요.';
    ovRow.innerHTML='';
    ovRow.append(
      btn('계속하기', true, () => { keepPlaying=true; hideOverlay(); }),
      btn('새 게임', false, newGame)
    );
    overlay.classList.add('show');
  }
  function showOver(){
    ovMsg.textContent='게임 오버';
    ovSub.textContent='더 이상 움직일 수 없어요. 점수 ' + score + '점.';
    ovRow.innerHTML='';
    ovRow.append(btn('다시 시작', true, newGame));
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  // ---------- 시작/되돌리기 ----------
  function newGame(){
    board.querySelectorAll('.tile').forEach(el => el.remove());
    grid = Array.from({length:SIZE}, () => Array(SIZE).fill(null));
    score=0; tileId=0; history=null; won=false; keepPlaying=false; over=false;
    undoBtn.disabled=true;
    hideOverlay(); updateScore();
    spawn(); spawn();
  }
  function undo(){
    if(!history) return;
    restore(history);
    history=null; undoBtn.disabled=true;
  }

  // ---------- 입력 ----------
  const KEYS = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
  };
  window.addEventListener('keydown', e => {
    const dir = KEYS[e.key];
    if(!dir) return;
    e.preventDefault();
    move(dir);
  });

  let sx=0, sy=0, tracking=false;
  board.addEventListener('touchstart', e => {
    const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  }, {passive:true});
  board.addEventListener('touchmove', e => { if(tracking) e.preventDefault(); }, {passive:false});
  board.addEventListener('touchend', e => {
    if(!tracking) return; tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    const ax=Math.abs(dx), ay=Math.abs(dy);
    if(Math.max(ax,ay) < 24) return;
    move(ax>ay ? (dx>0?'right':'left') : (dy>0?'down':'up'));
  }, {passive:true});

  newBtn.addEventListener('click', newGame);
  undoBtn.addEventListener('click', undo);

  // ---------- 부팅 ----------
  buildCells();
  layout();
  newGame();
})();
</script>
</body>
</html>
