<style>
  :root{
    --bg:#10141f;
    --panel:#1b2130;
    --ink:#e8ecf4;
    --muted:#8b93a7;
    --accent:#5b8cff;
    --accent-2:#8b5cf6;
    --radius:10px;
    --color-teal:#14b8a6;
    --color-lime:#84cc16;
    --color-gold:#eab308;
    --color-magenta:#d946ef;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(91,140,255,.14), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(139,92,246,.12), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Outfit', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%; max-width:460px;}

  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .brand{display:flex; flex-direction:column;}
  .logo{
    font-size:40px; font-weight:800; line-height:1; letter-spacing:-1px;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline{color:var(--muted); font-size:13px; margin-top:6px; max-width:210px; line-height:1.4;}

  .scores{display:flex; gap:8px;}
  .score{
    background:var(--panel); border-radius:var(--radius);
    padding:8px 14px; min-width:72px; text-align:center;
  }
  .score .label{font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase;}
  .score .val{font-size:22px; font-weight:700; line-height:1.1; margin-top:2px;}

  .controls{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  button{
    font-family:inherit; font-weight:600; font-size:14px; color:var(--ink);
    background:var(--panel); border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius); padding:10px 16px; cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:hover:not([disabled]){background:#232b3d;}
  button:active:not([disabled]){transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn-primary{
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    border-color:transparent; color:#fff;
  }
  .btn-primary:hover:not([disabled]){filter:brightness(1.05);}
  button[disabled]{opacity:.4; cursor:default; transform:none;}

  .game-board{
    width:100%; aspect-ratio:1/1;
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    margin-bottom:20px;
    user-select:none; touch-action:none;
  }
  .btn-color{
    border:none; padding:0; cursor:pointer;
    border-radius:16px; font-size:0; overflow:hidden;
    position:relative;
    transition:transform .1s ease, filter .08s ease;
  }
  .btn-color:active:not([disabled]){transform:scale(.95);}
  .btn-color:focus-visible{outline:3px solid var(--accent); outline-offset:-3px;}

  .btn-color.teal{background:var(--color-teal);}
  .btn-color.lime{background:var(--color-lime);}
  .btn-color.gold{background:var(--color-gold);}
  .btn-color.magenta{background:var(--color-magenta);}

  .btn-color.active{filter:brightness(1.4) drop-shadow(0 0 12px currentColor);}

  .status-text{
    text-align:center; font-size:16px; font-weight:600;
    margin-bottom:16px; min-height:24px; color:var(--ink);
  }
  .status-text.warning{color:#f97316;}
  .status-text.info{color:var(--muted); font-size:14px;}

  .ad-slot:empty{display:none;}
  .ad-slot{margin:16px 0;}

  footer{
    font-size:13px; color:var(--muted); text-align:center;
    margin-top:24px; line-height:1.6;
  }
  footer a{color:var(--ink); text-decoration:none; transition:color .2s;}
  footer a:hover{color:var(--accent);}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
</style>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">Simon</div>
        <div class="tagline">색 순서 기억 게임</div>
      </div>
      <div class="scores">
        <div class="score">
          <div class="label">라운드</div>
          <div class="val" id="round">1</div>
        </div>
        <div class="score">
          <div class="label">최고</div>
          <div class="val" id="best">-</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <button class="btn-primary" id="startBtn">시작</button>
    </div>

    <div class="status-text" id="statusText">게임을 시작하세요</div>

    <div class="game-board">
      <button class="btn-color teal" id="btn0" aria-label="Teal button"></button>
      <button class="btn-color lime" id="btn1" aria-label="Lime button"></button>
      <button class="btn-color gold" id="btn2" aria-label="Gold button"></button>
      <button class="btn-color magenta" id="btn3" aria-label="Magenta button"></button>
    </div>

    <!-- ▼▼▼ 애드센스 코드는 여기 안에 붙여넣으세요 (승인 후) ▼▼▼ -->
    <div class="ad-slot" id="ad-slot"></div>
    <!-- ▲▲▲ 광고 자리 (비어 있으면 화면에 안 보입니다) ▲▲▲ -->

    <footer>
      <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;">
        <a href="../how-to-play.html">게임 방법</a><span style="opacity:.4">·</span>
        <a href="../about.html">소개</a><span style="opacity:.4">·</span>
        <a href="../privacy.html">개인정보처리방침</a>
      </div>
      © <span id="fyear"></span> Fuse. 무료 퍼즐 게임.
    </footer>
  </div>

<script>
(() => {
  "use strict";

  const roundEl = document.getElementById('round');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('startBtn');
  const statusText = document.getElementById('statusText');
  const buttons = [
    document.getElementById('btn0'),
    document.getElementById('btn1'),
    document.getElementById('btn2'),
    document.getElementById('btn3')
  ];
  document.getElementById('fyear').textContent = new Date().getFullYear();

  // --- 저장소: try-catch + 메모리 폴백 ---
  const store = (() => {
    let mem = {};
    try {
      const k = '__simon_test';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return {
        get: k => localStorage.getItem(k),
        set: (k, v) => localStorage.setItem(k, v)
      };
    } catch {
      return {
        get: k => mem[k],
        set: (k, v) => { mem[k] = v; }
      };
    }
  })();

  let sequence = [];
  let playerSequence = [];
  let round = 1;
  let isPlayingSequence = false;
  let isGameOver = false;
  const PRESS_DURATION = 150;
  const SEQUENCE_DELAY = 600;

  let audioCtx = null;
  const playSound = (index) => {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const freq = [329.63, 415.30, 493.88, 659.25][index];
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } catch {}
  };

  const flashButton = async (index) => {
    buttons[index].classList.add('active');
    playSound(index);
    await new Promise(r => setTimeout(r, PRESS_DURATION));
    buttons[index].classList.remove('active');
    await new Promise(r => setTimeout(r, 100));
  };

  const playSequence = async () => {
    isPlayingSequence = true;
    statusText.textContent = '시퀀스 보기';
    statusText.classList.remove('warning');
    await new Promise(r => setTimeout(r, 500));

    for (const index of sequence) {
      await flashButton(index);
      await new Promise(r => setTimeout(r, SEQUENCE_DELAY - PRESS_DURATION));
    }

    isPlayingSequence = false;
    statusText.textContent = '따라 누르세요';
    playerSequence = [];
  };

  const startNewRound = () => {
    sequence.push(Math.floor(Math.random() * 4));
    playSequence();
  };

  const handleButtonPress = async (index) => {
    if (isPlayingSequence || isGameOver) return;

    playerSequence.push(index);
    await flashButton(index);

    const isCorrect = playerSequence[playerSequence.length - 1] === sequence[playerSequence.length - 1];
    if (!isCorrect) {
      gameOver();
      return;
    }

    if (playerSequence.length === sequence.length) {
      await new Promise(r => setTimeout(r, 600));
      round++;
      roundEl.textContent = round;
      startNewRound();
    }
  };

  const gameOver = () => {
    isGameOver = true;
    statusText.textContent = '게임 오버!';
    statusText.classList.add('warning');
    startBtn.textContent = '다시 하기';

    const best = parseInt(store.get('simon_best')) || 0;
    if (round > best) {
      store.set('simon_best', round);
      bestEl.textContent = round;
    }
  };

  const reset = () => {
    sequence = [];
    playerSequence = [];
    round = 1;
    isPlayingSequence = false;
    isGameOver = false;
    roundEl.textContent = round;
    statusText.textContent = '시작됨';
    statusText.classList.remove('warning');
    startBtn.textContent = '시작';

    buttons.forEach(btn => btn.classList.remove('active'));

    startNewRound();
  };

  startBtn.addEventListener('click', reset);
  buttons.forEach((btn, index) => {
    btn.addEventListener('click', () => handleButtonPress(index));
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      handleButtonPress(index);
    });
  });

  // 초기화: 최고 기록 로드
  const best = store.get('simon_best');
  if (best) bestEl.textContent = best;
})();
</script>
</body>
