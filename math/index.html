<style>
  :root{
    --bg:#10141f;
    --panel:#1b2130;
    --ink:#e8ecf4;
    --muted:#8b93a7;
    --accent:#5b8cff;
    --accent-2:#8b5cf6;
    --radius:10px;
    --go:#37a86e;
    --bad:#ee5a54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(91,140,255,.14), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(139,92,246,.12), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Outfit', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%; max-width:460px;}

  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .brand{display:flex; flex-direction:column;}
  .logo{
    font-size:40px; font-weight:800; line-height:1; letter-spacing:-1px;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline{color:var(--muted); font-size:13px; margin-top:6px; max-width:210px; line-height:1.4;}

  .scores{display:flex; gap:8px;}
  .score{
    background:var(--panel); border-radius:var(--radius);
    padding:8px 14px; min-width:64px; text-align:center;
  }
  .score .label{font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase;}
  .score .val{font-size:22px; font-weight:700; line-height:1.1; margin-top:2px;}

  /* 남은 시간 바 */
  .timebar-wrap{
    width:100%; height:10px; border-radius:999px;
    background:var(--panel); overflow:hidden; margin-bottom:14px;
  }
  .timebar{
    height:100%; width:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    transform-origin:left center;
  }
  .timebar.low{background:linear-gradient(90deg, #ee7a35, var(--bad));}

  .board-outer{position:relative; width:100%;}
  .board{
    position:relative; width:100%; min-height:340px;
    background:var(--panel); border-radius:16px; padding:20px 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    user-select:none;
  }

  .combo{
    font-size:13px; font-weight:700; color:var(--muted);
    min-height:20px; letter-spacing:.3px;
  }
  .combo.on{color:#eab308;}

  .question{
    font-size:46px; font-weight:800; line-height:1.1; letter-spacing:-1px;
    margin:8px 0 18px; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .question.correct{color:var(--go);}
  .question.wrong{color:var(--bad); animation:shake .3s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  .choices{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%;
  }
  .choice{
    font-family:inherit; font-size:24px; font-weight:700; color:var(--ink);
    background:#262e42; border:1px solid rgba(255,255,255,.07);
    border-radius:12px; padding:18px 10px; cursor:pointer;
    font-variant-numeric:tabular-nums;
    transition:transform .08s ease, background .12s ease;
    touch-action:manipulation;
  }
  .choice:hover:not([disabled]){background:#2e3750;}
  .choice:active:not([disabled]){transform:scale(.97);}
  .choice:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .choice.ok{background:var(--go); border-color:transparent; color:#fff;}
  .choice.no{background:var(--bad); border-color:transparent; color:#fff;}

  /* 시작 / 결과 오버레이 */
  .overlay{
    position:absolute; inset:0; border-radius:16px;
    background:rgba(16,20,31,.92); backdrop-filter:blur(3px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .hidden{display:none !important;}
  .overlay .big{font-size:28px; font-weight:800; line-height:1.2;}
  .overlay .sub{font-size:15px; color:var(--muted); line-height:1.5; margin-top:6px;}
  .ov-tier{font-size:44px; line-height:1; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  .ov-title{
    font-size:24px; font-weight:800; line-height:1.15; margin-top:2px;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .ov-final{font-size:15px; color:var(--ink); margin-top:6px;}
  .ov-final b{font-size:34px; font-weight:800; display:block; margin-top:2px;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .ov-stat{font-size:13px; color:var(--muted); margin-top:6px;}
  .ov-pct{
    font-size:15px; font-weight:700; color:var(--ink);
    background:var(--panel); border:1px solid rgba(255,255,255,.08);
    border-radius:999px; padding:6px 16px; margin-top:8px;
  }
  .ov-pct b{color:var(--accent);}
  .ov-actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; justify-content:center;}
  .btn-primary{
    font-family:inherit; font-weight:700; font-size:15px; color:#fff;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    border:none; border-radius:var(--radius); padding:12px 24px; cursor:pointer;
    transition:filter .15s ease, transform .08s ease;
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-primary:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .btn-ghost{
    font-family:inherit; font-weight:600; font-size:14px; color:var(--ink);
    background:var(--panel); border:1px solid rgba(255,255,255,.12);
    border-radius:var(--radius); padding:12px 18px; cursor:pointer;
    transition:background .15s ease, transform .08s ease;
  }
  .btn-ghost:hover{background:#232b3d;}
  .btn-ghost:active{transform:translateY(1px);}
  .btn-ghost:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .ov-note{font-size:11px; color:var(--muted); margin-top:10px; opacity:.8;}

  .ad-slot:empty{display:none;}
  .ad-slot{margin:16px 0;}

  footer{
    font-size:13px; color:var(--muted); text-align:center;
    margin-top:24px; line-height:1.6;
  }
  footer a{color:var(--ink); text-decoration:none; transition:color .2s;}
  footer a:hover{color:var(--accent);}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
    .question.wrong{animation:none;}
  }
</style>

        <div class="big" id="ov-big">빠른 암산</div>

<script>
(() => {
  "use strict";

  const questionEl = document.getElementById('question');
  const choicesEl  = document.getElementById('choices');
  const comboEl    = document.getElementById('combo');
  const scoreEl    = document.getElementById('score');
  const bestEl     = document.getElementById('best');
  const timebar    = document.getElementById('timebar');
  const overlay    = document.getElementById('overlay');
  const ovBig      = document.getElementById('ov-big');
  const ovSub      = document.getElementById('ov-sub');
  const ovTier     = document.getElementById('ov-tier');
  const ovTitle    = document.getElementById('ov-title');
  const ovFinal    = document.getElementById('ov-final');
  const ovScore    = document.getElementById('ov-score');
  const ovStat     = document.getElementById('ov-stat');
  const ovPct      = document.getElementById('ov-pct');
  const ovNote     = document.getElementById('ov-note');
  const startBtn   = document.getElementById('startBtn');
  const shareBtn   = document.getElementById('shareBtn');
  document.getElementById('fyear').textContent = new Date().getFullYear();

  // --- 저장소: try-catch + 메모리 폴백 ---
  const store = (() => {
    let mem = {};
    try {
      const k = '__math_test';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return {
        get: k => localStorage.getItem(k),
        set: (k, v) => localStorage.setItem(k, v)
      };
    } catch {
      return {
        get: k => (k in mem ? mem[k] : null),
        set: (k, v) => { mem[k] = String(v); }
      };
    }
  })();

  // --- 등급/칭호: 점수에 따라 ---
  const tierFor = (s) => {
    if (s >= 68) return { emoji:'🧠', title:'계산의 신' };
    if (s >= 52) return { emoji:'🏆', title:'마스터' };
    if (s >= 38) return { emoji:'💎', title:'전문가' };
    if (s >= 26) return { emoji:'🥇', title:'숙련' };
    if (s >= 14) return { emoji:'🥈', title:'견습' };
    return { emoji:'🥉', title:'초보' };
  };

  // --- 상위 %: 점수 구간별 추정(재미용) ---
  const percentileFor = (s) => {
    if (s <= 7)  return 95;
    if (s <= 14) return 85;
    if (s <= 22) return 68;
    if (s <= 31) return 48;
    if (s <= 42) return 30;
    if (s <= 55) return 15;
    if (s <= 70) return 6;
    return 2;
  };

  // --- 파라미터 ---
  const TOTAL_TIME = 30;    // 제한시간(초)
  const PENALTY = 2;        // 오답 시 시간 감소(초)

  let score = 0;
  let solved = 0;           // 맞힌 문제 수
  let missed = 0;           // 틀린 문제 수
  let combo = 0;
  let maxCombo = 0;
  let timeLeft = TOTAL_TIME;
  let running = false;
  let locked = false;       // 정답 피드백 중 중복 입력 방지
  let answer = 0;
  let rafId = null;
  let lastT = 0;

  let best = parseInt(store.get('math_best'), 10);
  if (!Number.isFinite(best)) best = 0;
  bestEl.textContent = best;

  const randInt = (min, max) => min + Math.floor(Math.random() * (max - min + 1));

  // 문제 생성: 맞힌 개수가 늘수록 난이도 상승
  const makeQuestion = () => {
    const lv = Math.min(4, Math.floor(solved / 6));   // 0~4 난이도 구간
    const ops = lv === 0 ? ['+', '-'] : (lv < 3 ? ['+', '-', '×'] : ['+', '-', '×']);
    const op = ops[randInt(0, ops.length - 1)];
    let a, b, ans;

    if (op === '×') {
      a = randInt(2, lv < 3 ? 9 : 12);
      b = randInt(2, lv < 3 ? 9 : 12);
      ans = a * b;
    } else if (op === '+') {
      const max = [20, 40, 70, 99, 150][lv];
      a = randInt(2, max); b = randInt(2, max);
      ans = a + b;
    } else {
      const max = [20, 40, 70, 99, 150][lv];
      a = randInt(5, max); b = randInt(2, a);        // 음수 방지
      ans = a - b;
    }
    return { text: `${a} ${op} ${b}`, ans };
  };

  // 정답 주변의 그럴듯한 오답 3개 생성
  const makeChoices = (ans) => {
    const set = new Set([ans]);
    let guard = 0;
    while (set.size < 4 && guard++ < 50) {
      const spread = Math.max(2, Math.round(Math.abs(ans) * 0.12));
      let cand = ans + randInt(-spread - 3, spread + 3);
      if (cand === ans || cand < 0) continue;
      set.add(cand);
    }
    // 극단적 상황 대비(중복/음수로 못 채운 경우)
    let filler = ans + 1;
    while (set.size < 4) { if (filler >= 0) set.add(filler); filler++; }

    const arr = [...set];
    // Fisher-Yates 셔플
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  const renderCombo = () => {
    if (combo >= 2) {
      comboEl.textContent = `🔥 ${combo} 콤보`;
      comboEl.classList.add('on');
    } else {
      comboEl.textContent = '';
      comboEl.classList.remove('on');
    }
  };

  const nextQuestion = () => {
    const q = makeQuestion();
    answer = q.ans;
    questionEl.textContent = q.text;
    questionEl.className = 'question';
    choicesEl.innerHTML = makeChoices(q.ans)
      .map(v => `<button class="choice" data-v="${v}">${v}</button>`)
      .join('');
    locked = false;
  };

  const updateBar = () => {
    const ratio = Math.max(0, Math.min(1, timeLeft / TOTAL_TIME));
    timebar.style.transform = `scaleX(${ratio})`;
    timebar.classList.toggle('low', ratio < 0.3);
  };

  const loop = (t) => {
    if (!running) return;
    if (!lastT) lastT = t;
    timeLeft -= (t - lastT) / 1000;
    lastT = t;
    if (timeLeft <= 0) {
      timeLeft = 0;
      updateBar();
      finish();
      return;
    }
    updateBar();
    rafId = requestAnimationFrame(loop);
  };

  const onChoice = (e) => {
    if (!running || locked) return;
    const btn = e.target.closest('.choice');
    if (!btn) return;
    locked = true;

    const picked = parseInt(btn.dataset.v, 10);
    if (picked === answer) {
      // 정답: 콤보가 쌓일수록 보너스 점수(최대 +3)
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      solved++;
      score += 1 + Math.min(2, Math.floor(combo / 4));
      scoreEl.textContent = score;
      btn.classList.add('ok');
      questionEl.classList.add('correct');
      renderCombo();
      setTimeout(() => { if (running) nextQuestion(); }, 160);
    } else {
      // 오답: 콤보 리셋 + 시간 감소
      combo = 0;
      missed++;
      renderCombo();
      btn.classList.add('no');
      questionEl.classList.add('wrong');
      // 정답 위치도 함께 표시해 학습 피드백
      const okBtn = [...choicesEl.children].find(b => parseInt(b.dataset.v, 10) === answer);
      if (okBtn) okBtn.classList.add('ok');
      timeLeft -= PENALTY;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateBar();
        finish();
        return;
      }
      updateBar();
      setTimeout(() => { if (running) nextQuestion(); }, 420);
    }
  };

  const finish = () => {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null; lastT = 0;

    const isNewBest = score > best;
    if (isNewBest) {
      best = score;
      store.set('math_best', best);
      bestEl.textContent = best;
    }

    const tier = tierFor(score);
    const pct = percentileFor(score);
    ovBig.textContent = '시간 종료!';
    ovSub.classList.add('hidden');
    ovTier.textContent = tier.emoji;
    ovTitle.textContent = (isNewBest ? '🎉 최고 기록! · ' : '') + tier.title;
    ovScore.textContent = score;
    ovStat.textContent = `맞힘 ${solved}문제 · 최대 ${maxCombo} 콤보`;
    ovPct.innerHTML = '상위 <b>' + pct + '%</b>';
    [ovTier, ovTitle, ovFinal, ovStat, ovPct, ovNote, shareBtn].forEach(el => el.classList.remove('hidden'));
    startBtn.textContent = '다시 하기';
    overlay.classList.remove('hidden');
  };

  // 결과 공유(Web Share 우선, 미지원 시 클립보드 복사)
  const shareResult = async () => {
    const tier = tierFor(score);
    const pct = percentileFor(score);
    const text = `빠른 암산 30초에 ${score}점! ${tier.emoji} ${tier.title} (상위 ${pct}%)\nhttps://fusepuzzle.com/math/`;
    try {
      if (navigator.share) {
        await navigator.share({ text });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        shareBtn.textContent = '복사됨!';
        setTimeout(() => { shareBtn.textContent = '결과 복사'; }, 1500);
      }
    } catch {}
  };

  const startGame = () => {
    score = 0; solved = 0; missed = 0; combo = 0; maxCombo = 0;
    timeLeft = TOTAL_TIME;
    running = true; locked = false; lastT = 0;
    scoreEl.textContent = '0';
    renderCombo();
    overlay.classList.add('hidden');
    ovSub.classList.remove('hidden');
    [ovTier, ovTitle, ovFinal, ovStat, ovPct, ovNote, shareBtn].forEach(el => el.classList.add('hidden'));
    updateBar();
    nextQuestion();
    rafId = requestAnimationFrame(loop);
  };

  choicesEl.addEventListener('click', onChoice);
  startBtn.addEventListener('click', startGame);
  shareBtn.addEventListener('click', shareResult);

  // 키보드: 1~4로 보기 선택
  document.addEventListener('keydown', (e) => {
    if (!running || locked) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      const btn = choicesEl.children[n - 1];
      if (btn) { e.preventDefault(); onChoice({ target: btn }); }
    }
  });

  updateBar();
})();
</script>
</body>
</html>
